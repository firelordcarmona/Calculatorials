<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Calculator </title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #d8d3c8;
      font-family: 'Arial', sans-serif;
    }

    .calculator {
      background: linear-gradient(145deg, #43464b, #2b2d30);
      padding: 18px;
      border-radius: 10px;
      border: 3px solid #1a1b1d;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.45), inset 0 2px 2px rgba(255, 255, 255, 0.15);
      width: 270px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .brand {
      color: #e6e6e6;
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 1.1rem;
    }

    .model {
      color: #a0a5ab;
      font-size: 0.7rem;
      display: block;
      letter-spacing: 0.5px;
    }
        .solar-panel {
      width: 85px;
      height: 22px;
      background: repeating-linear-gradient(
        90deg,
        #3b2a22,
        #3b2a22 19px,
        #1f1511 20px,
        #1f1511 21px
      );
      border: 2px solid #18191b;
      border-radius: 3px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .screen-bezel {
      background-color: #1c1d1f;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 16px;
      border: 2px solid #555960;
    }

    #display {
      width: 100%;
      height: 48px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 1.9rem;
      text-align: right;
      padding: 6px 10px;
      box-sizing: border-box;
      border: 2px solid #6b735b;
      border-radius: 3px;
      background-color: #9ead86;
      color: #1c2215;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.35);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    button {
      height: 44px;
      font-size: 1.1rem;
      font-weight: bold;
      border: 1px solid #111;
      border-radius: 5px;
      cursor: pointer;
      background-color: #e8e6df;
      color: #1e1e1e;
      box-shadow: 0 3px 0 #18191b;
      transition: transform 0.05s, box-shadow 0.05s;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 #18191b;
    }

    /* Dark gray operator keys */
    .operator {
      background-color: #5c6066;
      color: #ffffff;
    }

    .clear {
      background-color: #d9532f;
      color: #ffffff;
    }

    /* Blue equals key */
    .equals {
      background-color: #2c6ea3;
      color: #ffffff;
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="top-bar">
      <div>
        <span class="brand">CASIO</span>
        <span class="model">ELECTRONIC CALCULATOR</span>
      </div>
      <div class="solar-panel" title="Solar Cell"></div>
    </div>

    <div class="screen-bezel">
      <input type="text" id="display" readonly placeholder="0">
    </div>

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">AC</button>
      <button class="clear" onclick="deleteLast()">C</button>
      <button class="operator" onclick="appendValue('%')">%</button>
      <button class="operator" onclick="appendValue('/')">÷</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('*')">×</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('-')">−</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(value) {
      if (display.value === 'Error') {
        display.value = '';
      }
      display.value += value;
    }

    function clearDisplay() {
      display.value = '';
    }

    function deleteLast() {
      if (display.value === 'Error') {
        display.value = '';
      } else {
        display.value = display.value.slice(0, -1);
      }
    }

    function calculate() {
      try {
        if (!display.value) return;
        const expression = display.value.replace(/%/g, '/100');
        if (/^[0-9+\-*/.() ]+$/.test(expression)) {
          const result = Function('"use strict";return (' + expression + ')')();
          display.value = Number.isFinite(result) ? result : 'Error';
        } else {
          display.value = 'Error';
        }
      } catch (e) {
        display.value = 'Error';
      }
    }
  </script>

</body>
</html>
